name: Server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Answers initialize over stdio
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | JOTTER_NOTES_FILE="$RUNNER_TEMP/notes.json" timeout 10 node dist/main.js 2>/dev/null \
            | grep '"name":"jotter"'
      - name: Packs only dist
        run: npm pack --dry-run 2>&1 | tee pack.txt && ! grep -E 'src/|test/' pack.txt
